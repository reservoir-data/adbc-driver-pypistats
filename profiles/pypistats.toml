# ADBC connection profile for the pypistats driver.
#
# Use with:  ADBC_PROFILE_PATH=./profiles  and  uri = "profile://pypistats"
# or copy to ~/Library/Application Support/ADBC/Profiles/ (macOS) /
# ~/.config/adbc/profiles/ (Linux).
#
# `driver` is omitted so the application can point at a locally built
# library; set it to a driver manifest name or an absolute path to the
# shared library once installed.
profile_version = 1

[Options]
# Default scope for queries without `WHERE package ...`. Profile values can't
# be arrays, so packages are comma-separated.
"pypistats.query.packages" = "{{ env_var(PYPISTATS_PACKAGES) }}"
